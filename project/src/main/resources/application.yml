server:
  port: 8001

spring:
  application:
    name: short-link-project
  datasource:
    # ShardingSphere 实现分库分表配置
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # shardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yml
  data:
    redis:
      host: localhost
      port: 6379
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8964

short-link:
  domain:
    default: mercemay.com:8001
  stats:
    locale:
      amap-key: 2b3698715ce9c881bd4bfecac7fe940f
  route:
    whitelist:
      enabled: true
      name: '知乎,哔哩哔哩'
      details:
        - zhihu.com
        - bilibili.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: shortlink-stats-producer-group
    topic: shortlink-stats-topic
    send-message-timeout: 2000
    retry-times-when-send-failed: 1
    retry-times-when-send-async-failed: 1
  consumer:
    group: shortlink-stats-consumer-group