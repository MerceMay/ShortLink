server:
  port: 8002

spring:
  application:
    name: short-link-admin
  datasource:
    # ShardingSphere 实现分库分表配置
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # shardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yml
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8964

short-link:
  group:
    max-num: 20
  user-traffic-control:
    enabled: true
    time-window: 1
    max-requests: 20