server:
  port: 8002

spring:
  datasource:
    # ShardingSphere 实现分库分表配置
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # shardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yml
  data:
    redis:
      host: localhost
      port: 6379

short-link:
  group:
    max-num: 20
  user-traffic-control:
    enabled: true
    time-window: 1
    max-requests: 20